# --- Biofisica e biomecanica (2026-10-12) ------------------------------------
# Instalados em 2026-10-12 com `pixi global install` avulso e esquecidos fora
# deste manifesto: como o 05 copia este arquivo por cima de
# ~/.pixi/manifests/pixi-global.toml e roda `pixi global sync`, qualquer
# reexecucao do 05 os apagaria em silencio. Entraram aqui em 2026-10-16, na
# reconstrucao da distro, com os blocos que o proprio pixi gerou.
# OpenMM e OpenSim sao bibliotecas: o que se expoe e o python do ambiente.

[envs.gromacs]
channels = ["conda-forge"]
dependencies = { gromacs = "==2026.3" }
exposed = { gmx = "gmx" }

[envs.pymol]
channels = ["conda-forge"]
dependencies = { pymol-open-source = "==3.1.0" }
exposed = { pymol = "pymol" }

[envs.openmm]
channels = ["conda-forge"]
dependencies = { python = "==3.11.14", openmm = "==8.6.1" }
exposed = { python-openmm = "python" }

[envs.opensim]
channels = ["opensim-org", "conda-forge"]
dependencies = { opensim = "==4.6" }
exposed = { python-opensim = "python" }
