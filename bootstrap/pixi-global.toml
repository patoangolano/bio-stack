# bio-stack — manifesto do pixi global no WSL (Ubuntu-24.04).
#
# Fonte da verdade das CLIs de bioinformatica. Aplicado por
# bootstrap/05_wsl_ferramentas.sh (copia para ~/.pixi/manifests/ e roda
# `pixi global sync`), que tambem grava pixi-global.snapshot.tsv com build e
# sha256 do que foi instalado — o pixi global nao tem lockfile (issue #1280),
# entao a versao exata fica aqui (==) e o build, no snapshot.
#
# Um ambiente por ferramenta (ou grupo coeso, como hts e kent) isola dependencias
# e atualizacoes. Tudo junto tambem resolve (os 43 pacotes, pixi 0.81.0, ~2 s),
# mas ali o perl cai para 5.32.1 (hts e parallel usam 5.44), clipkit e
# orthofinder descem para python 3.13 e o bcftools 1.24 troca de build. Versoes conferidas ao vivo em 2026-10-11 (anaconda.org e
# `pixi search`) e cada binario testado depois da instalacao.
#
# O ambiente `hts` (samtools/bcftools/htslib 1.24) faz sombra ao apt 1.19 em
# /usr/bin, porque ~/.pixi/bin vem antes no PATH. De proposito: o htslib 1.19
# do Ubuntu 24.04 tem CVEs abertas no decodificador CRAM, corrigidas na 1.23.1.
#
# Para acrescentar uma ferramenta: `pixi global install -c conda-forge -c bioconda
# --environment <nome> "<pacote>==<versao>"` no WSL, depois copie
# ~/.pixi/manifests/pixi-global.toml de volta para ca e rode o bootstrap para
# regravar o snapshot.

